[project]
name = "nemohermes-reachy"
version = "0.1.0"
description = "A bounded wireless Reachy output bridge for sandboxed Hermes agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "pyyaml>=6,<7"]

[project.scripts]
reachy-bridge = "reachy_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
voice = ["reachy-mini==1.9.0", "faster-whisper>=1.2,<2", "av>=12,<17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
